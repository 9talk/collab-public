<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborator</title>
    <link rel="stylesheet" href="./src/shell.css" />
  </head>

  <body>
    <div id="titlebar"></div>

    <button
      type="button"
      id="nav-toggle"
      class="panel-toggle"
      aria-pressed="true"
      aria-label="Hide Navigator"
      data-tooltip="Toggle Nav"
    ></button>

    <div id="panels">
      <div id="panel-nav">
        <div id="nav-toolbar">
          <button
            type="button"
            id="settings-btn"
            aria-label="Settings"
            data-tooltip="Settings"
            data-shortcut="Cmd+,"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 256 256"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm109.94-52.79a8,8,0,0,0-3.89-5.4l-29.83-17-.12-33.62a8,8,0,0,0-2.83-6.08,111.91,111.91,0,0,0-36.72-20.67,8,8,0,0,0-6.46.59L128,41.85,97.88,25a8,8,0,0,0-6.47-.6A112.1,112.1,0,0,0,54.73,45.15a8,8,0,0,0-2.83,6.07l-.15,33.65-29.83,17a8,8,0,0,0-3.89,5.4,106.47,106.47,0,0,0,0,41.56,8,8,0,0,0,3.89,5.4l29.83,17,.12,33.62a8,8,0,0,0,2.83,6.08,111.91,111.91,0,0,0,36.72,20.67,8,8,0,0,0,6.46-.59L128,214.15,158.12,231a7.91,7.91,0,0,0,3.9,1,8.09,8.09,0,0,0,2.57-.42,112.1,112.1,0,0,0,36.68-20.73,8,8,0,0,0,2.83-6.07l.15-33.65,29.83-17a8,8,0,0,0,3.89-5.4A106.47,106.47,0,0,0,237.94,107.21Zm-15,34.91-28.57,16.25a8,8,0,0,0-3,3c-.58,1-1.19,2.06-1.81,3.06a7.94,7.94,0,0,0-1.22,4.21l-.15,32.25a95.89,95.89,0,0,1-25.37,14.3L134,199.13a8,8,0,0,0-3.91-1h-.19c-1.21,0-2.43,0-3.64,0a8.08,8.08,0,0,0-4.1,1l-28.84,16.1A96,96,0,0,1,67.88,201l-.11-32.2a8,8,0,0,0-1.22-4.22c-.62-1-1.23-2-1.8-3.06a8.09,8.09,0,0,0-3-3.06l-28.6-16.29a90.49,90.49,0,0,1,0-28.26L61.67,97.63a8,8,0,0,0,3-3c.58-1,1.19-2.06,1.81-3.06a7.94,7.94,0,0,0,1.22-4.21l.15-32.25a95.89,95.89,0,0,1,25.37-14.3L122,56.87a8,8,0,0,0,4.1,1c1.21,0,2.43,0,3.64,0a8.08,8.08,0,0,0,4.1-1l28.84-16.1A96,96,0,0,1,188.12,55l.11,32.2a8,8,0,0,0,1.22,4.22c.62,1,1.23,2,1.8,3.06a8.09,8.09,0,0,0,3,3.06l28.6,16.29A90.49,90.49,0,0,1,222.9,142.12Z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="remote-btn"
            aria-label="Remote"
            data-tooltip="Remote"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 256 256"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152Zm73.71,7.14a80,80,0,0,1-14.08,22.2,8,8,0,0,1-11.92-10.67,63.95,63.95,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67,80.08,80.08,0,0,1,14.08,84.47ZM69,103.09a64,64,0,0,0,11.26,67.58,8,8,0,0,1-11.92,10.67,79.93,79.93,0,0,1,0-106.67A8,8,0,1,1,80.29,85.34,63.77,63.77,0,0,0,69,103.09ZM248,128a119.58,119.58,0,0,1-34.29,84,8,8,0,1,1-11.42-11.2,103.9,103.9,0,0,0,0-145.56A8,8,0,1,1,213.71,44,119.58,119.58,0,0,1,248,128ZM53.71,200.78A8,8,0,1,1,42.29,212a119.87,119.87,0,0,1,0-168,8,8,0,1,1,11.42,11.2,103.9,103.9,0,0,0,0,145.56Z"
              />
            </svg>
          </button>
          <div
            id="remote-indicator"
            class="remote-indicator"
            style="display: none"
          >
            <span id="remote-status-dot" class="remote-dot"></span>
            <span id="remote-status-text"></span>
          </div>
          <div id="sidebar-mode-control">
            <button type="button" class="mode-btn active" data-mode="files">
              Files
            </button>
            <button type="button" class="mode-btn" data-mode="tiles">
              Tiles
            </button>
            <button type="button" class="mode-btn" data-mode="todos">
              Todos
            </button>
          </div>
        </div>
      </div>
      <div id="nav-resize" class="resize-handle" data-panel="nav"></div>
      <div id="panel-viewer">
        <button
          type="button"
          id="new-tile-btn"
          aria-label="New tile"
          data-tooltip="Create tile"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 256 256"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z"
            />
          </svg>
        </button>
        <button
          type="button"
          id="relayout-btn"
          aria-label="Relayout terminals"
          data-tooltip="Relayout terminals"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 256 256"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M216,56A8,8,0,0,0,208,48H88a8,8,0,0,0,0,16H200V168a8,8,0,0,0,16,0ZM160,208H48V104a8,8,0,0,0-16,0V208a8,8,0,0,0,8,8H160a8,8,0,0,0,0-16ZM96,72a8,8,0,0,1,8-8H192a8,8,0,0,1,0,16H104A8,8,0,0,1,96,72ZM104,96H48A8,8,0,0,0,40,104V200a8,8,0,0,0,16,0V112H104a8,8,0,0,0,0-16Z"
            />
          </svg>
        </button>
        <canvas id="grid-canvas"></canvas>
        <div id="tile-layer"></div>
        <div id="edge-indicators"></div>
        <div id="zoom-indicator">100%</div>
        <div id="minimap-wrapper">
          <canvas id="minimap-canvas"></canvas>
        </div>
        <div id="notification-container"></div>
      </div>
    </div>

    <div id="settings-overlay">
      <div id="settings-backdrop"></div>
      <div id="settings-modal"></div>
    </div>

    <div id="canvas-skill-dialog" class="hidden">
      <div id="canvas-skill-backdrop"></div>
      <div id="canvas-skill-modal">
        <h2>Canvas Skill for AI Agents</h2>
        <p>
          Collaborator can install a canvas skill for your AI coding agents,
          letting them arrange tiles on your workspace.
        </p>
        <div id="canvas-skill-agents"></div>
        <div id="canvas-skill-actions">
          <button type="button" id="canvas-skill-skip">Skip</button>
          <button type="button" id="canvas-skill-install">Install</button>
        </div>
      </div>
    </div>

    <div id="resize-overlay"></div>

    <div id="loading-overlay">
      <div id="loading-spinner"></div>
      <div id="loading-status">Initializing&#x2026;</div>
    </div>

    <script type="module" src="./src/renderer.js"></script>
  </body>
</html>
